name: private-polis

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: private_polis
      POSTGRES_USER: private_polis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-private_polis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_polis -d private_polis"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    networks:
      - backend

  migration:
    build:
      context: .
      dockerfile: deploy/docker/app.Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://private_polis:${POSTGRES_PASSWORD:-private_polis}@postgres:5432/private_polis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  application:
    build:
      context: .
      dockerfile: deploy/docker/app.Dockerfile
      target: application
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://private_polis:${POSTGRES_PASSWORD:-private_polis}@postgres:5432/private_polis
      PORT: 3000
      STATIC_ROOT: /app/public
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
      - frontend

  analysis:
    build:
      context: services/analysis
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://private_polis:${POSTGRES_PASSWORD:-private_polis}@postgres:5432/private_polis
      ANALYSIS_POLL_INTERVAL_SECONDS: 2
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      application:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres-data-v18:

networks:
  backend:
    internal: true
  frontend:

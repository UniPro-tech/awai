name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  analysis:
    name: Analysis worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://private_polis:private_polis@localhost:5432/private_polis
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: private_polis
          POSTGRES_USER: private_polis
          POSTGRES_PASSWORD: private_polis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U private_polis -d private_polis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @private-polis/server test:integration

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [typescript, analysis, postgres-integration]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            context: .
            file: deploy/docker/app.Dockerfile
            target: application
          - name: migration
            context: .
            file: deploy/docker/app.Dockerfile
            target: migration
          - name: analysis
            context: services/analysis
            file: services/analysis/Dockerfile
            target: analysis
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Resolve GHCR image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          echo "name=ghcr.io/${owner}/${repository}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Awai ${{ matrix.name }}
            org.opencontainers.image.description=Awai ${{ matrix.name }} container image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/private-polis --set existingSecret=private-polis-ci
      - run: helm template private-polis deploy/helm/private-polis --set existingSecret=private-polis-ci
      - run: helm lint deploy/helm/private-polis --set postgresql.enabled=true --set postgresql.auth.password=ci-password --set auth.secret=ci-secret-at-least-32-characters
      - run: helm lint deploy/helm/private-polis --values deploy/helm/private-polis/examples/ingress-values.yaml --set existingSecret=private-polis-ci
      - run: helm lint deploy/helm/private-polis --values deploy/helm/private-polis/examples/gateway-values.yaml --set existingSecret=private-polis-ci
      - name: Verify Argo CD migration ordering
        shell: bash
        run: |
          rendered="$RUNNER_TEMP/private-polis-argocd.yaml"
          helm template private-polis deploy/helm/private-polis \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=ci-password \
            --set auth.secret=ci-secret-at-least-32-characters > "$rendered"
          grep -Fq 'argocd.argoproj.io/hook: Sync' "$rendered"
          grep -Fq 'argocd.argoproj.io/sync-wave: "-5"' "$rendered"
          test "$(grep -Fc 'argocd.argoproj.io/sync-wave: "-10"' "$rendered")" -eq 4

  publish-helm:
    name: Publish Helm chart
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [containers, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - id: release
        name: Resolve chart version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must use vX.Y.Z semantic versioning." >&2
              exit 1
            fi
            app_version="$version"
          else
            version="0.0.0-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            app_version="sha-${GITHUB_SHA}"
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
      - name: Package chart
        run: |
          helm package deploy/helm/private-polis \
            --destination dist \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.app-version }}"
      - name: Sign in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish chart
        run: helm push "dist/private-polis-${{ steps.release.outputs.version }}.tgz" "${{ steps.release.outputs.registry }}"

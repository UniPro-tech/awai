name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "deploy/helm/private-polis/examples/**"
      - "*.md"
      - "renovate.json"
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "deploy/helm/private-polis/examples/**"
      - "*.md"
      - "renovate.json"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  analysis:
    name: Analysis worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://private_polis:private_polis@localhost:5432/private_polis
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: private_polis
          POSTGRES_USER: private_polis
          POSTGRES_PASSWORD: private_polis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U private_polis -d private_polis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @private-polis/server test:integration

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [typescript, analysis, postgres-integration]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            context: .
            file: deploy/docker/app.Dockerfile
            target: application
          - name: migration
            context: .
            file: deploy/docker/app.Dockerfile
            target: migration
          - name: analysis
            context: services/analysis
            file: services/analysis/Dockerfile
            target: analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: image
        name: Resolve GHCR image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          echo "name=ghcr.io/${owner}/${repository}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Awai ${{ matrix.name }}
            org.opencontainers.image.description=Awai ${{ matrix.name }} container image
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint deploy/helm/private-polis --set existingSecret=private-polis-ci
      - run: helm template private-polis deploy/helm/private-polis --set existingSecret=private-polis-ci
      - run: helm lint deploy/helm/private-polis --set postgresql.enabled=true --set postgresql.auth.password=ci-password --set auth.secret=ci-secret-at-least-32-characters
      - run: helm lint deploy/helm/private-polis --values deploy/helm/private-polis/examples/ingress-values.yaml --set existingSecret=private-polis-ci
      - run: helm lint deploy/helm/private-polis --values deploy/helm/private-polis/examples/gateway-values.yaml --set existingSecret=private-polis-ci
      - name: Verify release versions stay aligned
        shell: bash
        run: |
          package_version="$(jq -r '.version' package.json)"
          manifest_version="$(jq -r '.["."]' .release-please-manifest.json)"
          chart_version="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/private-polis/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' deploy/helm/private-polis/Chart.yaml)"
          if [[ "$package_version" != "$manifest_version" || "$package_version" != "$chart_version" || "$package_version" != "$app_version" ]]; then
            echo "Release versions are not aligned: package=$package_version manifest=$manifest_version chart=$chart_version app=$app_version" >&2
            exit 1
          fi
      - name: Verify Argo CD migration ordering
        shell: bash
        run: |
          rendered="$RUNNER_TEMP/private-polis-argocd.yaml"
          helm template private-polis deploy/helm/private-polis \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=ci-password \
            --set auth.secret=ci-secret-at-least-32-characters > "$rendered"
          grep -Fq 'argocd.argoproj.io/hook: Sync' "$rendered"
          grep -Fq 'argocd.argoproj.io/sync-wave: "-5"' "$rendered"
          test "$(grep -Fc 'argocd.argoproj.io/sync-wave: "-10"' "$rendered")" -eq 4
          test "$(grep -Fc 'runAsUser: 10001' "$rendered")" -eq 3
          test "$(grep -Fc 'runAsGroup: 10001' "$rendered")" -eq 3

  publish-helm:
    name: Publish Helm chart
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [containers, helm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - id: release
        name: Resolve chart version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must use vX.Y.Z semantic versioning." >&2
              exit 1
            fi
            app_version="$version"
          else
            version="0.0.0-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            app_version="sha-${GITHUB_SHA}"
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "registry=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"
      - name: Package chart
        run: |
          helm package deploy/helm/private-polis \
            --destination dist \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.app-version }}"
      - name: Sign in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish chart
        run: helm push "dist/private-polis-${{ steps.release.outputs.version }}.tgz" "${{ steps.release.outputs.registry }}"

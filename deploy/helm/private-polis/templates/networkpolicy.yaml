{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "private-polis.fullname" . }}-application
  labels:
    {{- include "private-polis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "private-polis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: application
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
    # OIDC and SAML require outbound HTTPS for discovery, metadata, token,
    # certificate, and user-info endpoints. Standard NetworkPolicy resources
    # cannot restrict destinations by DNS name, so constrain this access by
    # port and use a CNI-specific FQDN policy when stricter control is needed.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "private-polis.fullname" . }}-workers
  labels:
    {{- include "private-polis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [{{ include "private-polis.name" . }}]
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [analysis, migration]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "private-polis.fullname" . }}-postgresql
  labels:
    {{- include "private-polis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "private-polis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "private-polis.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
{{- end }}

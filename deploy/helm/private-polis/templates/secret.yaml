{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "private-polis.fullname" . }}
  labels:
    {{- include "private-polis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  DATABASE_URL: {{ include "private-polis.databaseUrl" . | quote }}
  BETTER_AUTH_SECRET: {{ .Values.auth.secret | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}

[project]
name = "private-polis-analysis"
version = "0.1.0"
description = "PostgreSQL-backed statistical analysis worker for Awai"
requires-python = ">=3.12,<3.15"
dependencies = [
  "psycopg[binary]>=3.2.10,<4",
  "red-dwarf==0.4.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
  "ruff>=0.14.0,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["reddwarf.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
